# DocSentry, whole stack, one box.
#
#   docker compose up -d --build
#
# Four application containers from one image plus Redis, Caddy and Grafana.
# Postgres is not here: it is Supabase, reached over the network, which is the
# one piece of state this box does not own. Losing the box loses no data.
#
# Required in .env next to this file:
#   GEMINI_API_KEY, DATABASE_URL, DOMAIN, ACME_EMAIL, GRAFANA_PASSWORD
# Optional: SENTRY_DSN, LANGSMITH_*

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: docsentry:latest
  restart: unless-stopped
  env_file: .env
  environment:
    CELERY_BROKER_URL: redis://redis:6379/0
    # Caddy is the only route to the API: the port is not published, so nothing
    # can reach the app without passing through the proxy, and Caddy overwrites
    # X-Forwarded-For on the way. That is what makes the header trustworthy
    # here, and it is the only condition under which it is. Publish the port
    # directly, or put something in front that does not set the header, and this
    # must go back to false: X-Forwarded-For is client-supplied, so trusting it
    # otherwise lets anyone reset their own rate limit per request.
    TRUST_PROXY_HEADERS: "true"
  depends_on:
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    # No published port. Caddy is the only way in, so the app is never exposed
    # on the host and TLS cannot be bypassed by hitting the port directly.
    expose:
      - "7860"

  worker:
    <<: *app
    # Concurrency is 1 in celery_app.py as well. Two rebuilds at once would race
    # on the same collection and compete for the same embedding quota, which is
    # how M2's latency report got poisoned.
    command: celery -A app.celery_app.celery_app worker --loglevel=info --concurrency=1
    healthcheck:
      # CMD-SHELL, not CMD. In exec form nothing expands $$HOSTNAME, so celery
      # was asked to ping a node literally named "celery@$HOSTNAME", no node
      # matched, and a working worker reported "No nodes replied" forever.
      #
      # The node is named explicitly rather than pinging every node, because a
      # second worker answering would mask this one being dead.
      test: ["CMD-SHELL", "celery -A app.celery_app.celery_app inspect ping -d celery@$$(hostname) --timeout 10"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 45s

  beat:
    <<: *app
    # The schedule file goes in a named volume so Beat remembers when it last
    # ran. A fresh file on every restart means it can fire again immediately.
    #
    # The path is under the container user's home on purpose. A named volume is
    # created root-owned, and this image runs as uid 10001, so mounting it
    # anywhere else gives "[Errno 13] Permission denied" the moment Beat writes
    # its schedule. Docker seeds a new volume from the image's contents at that
    # path, so mounting over a directory the user already owns carries the
    # ownership across.
    command: celery -A app.celery_app.celery_app beat --loglevel=info --schedule=/home/docsentry/state/beat-schedule
    volumes:
      - beat-schedule:/home/docsentry/state
    healthcheck:
      # Beat inherits the image's HEALTHCHECK, which curls the API. Beat serves
      # no HTTP, so it reported unhealthy forever while working perfectly. A
      # container that is permanently red teaches everyone to ignore the colour.
      #
      # Beat rewrites its schedule file on every tick, and max_interval is five
      # minutes, so a file older than fifteen means it has stopped ticking.
      # That is an actual liveness signal rather than a green light for nothing.
      test: ["CMD-SHELL", "test -f /home/docsentry/state/beat-schedule && test $$(( $$(date +%s) - $$(stat -c %Y /home/docsentry/state/beat-schedule) )) -lt 900"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Broker only. Everything in it is a job that can be re-queued, so there is
    # nothing worth persisting and appendonly stays off deliberately.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      # Required, because Caddy's `email` directive fails to parse with no
      # argument and takes the whole reverse proxy down with it. Unused when
      # DOMAIN is localhost, where Caddy issues its own local certificate.
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    # Not published either. Caddy serves it at /grafana, so it is behind the
    # same TLS and not a second open port on the internet.
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${DOMAIN:-localhost}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Grafana provisioning cannot parse a SQLAlchemy URL, so the same
      # database is given in parts. Use a read-only role: Grafana runs arbitrary
      # SQL from dashboards against the audit trail.
      DS_DB_HOST: ${DS_DB_HOST:?set DS_DB_HOST in .env}
      DS_DB_PORT: ${DS_DB_PORT:-5432}
      DS_DB_NAME: ${DS_DB_NAME:-postgres}
      DS_DB_USER: ${DS_DB_USER:?set DS_DB_USER in .env}
      DS_DB_PASSWORD: ${DS_DB_PASSWORD:?set DS_DB_PASSWORD in .env}
      DS_DB_SSLMODE: ${DS_DB_SSLMODE:-require}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  beat-schedule:
  caddy-data:
  caddy-config:
  grafana-data:
